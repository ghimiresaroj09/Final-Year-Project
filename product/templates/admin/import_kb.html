{% extends "admin/base_site.html" %}

{% block content %}
  <h1>Import KnowledgeBase entries</h1>
  <p>Upload a CSV with columns: <strong>title, content, keywords, is_active</strong></p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div>
      <label for="csv_file">CSV file</label>
      <input type="file" name="csv_file" id="csv_file" accept=".csv" required>
    </div>
    <br>
    <button type="submit" class="default">Upload and import</button>
    <a href="{{ site_url }}" class="button">Back</a>
  </form>
{% endblock %}
