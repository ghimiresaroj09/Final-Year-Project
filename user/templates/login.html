{% extends 'base.html' %} 
{% block content %}

<style>
  .auth-container {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 20px;
  }

  .auth-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    padding: 40px;
    width: 100%;
    max-width: 450px;
  }

  .auth-header {
    text-align: center;
    margin-bottom: 35px;
  }

  .auth-header h2 {
    font-size: 28px;
    font-weight: 700;
    color: #0f1419;
    margin-bottom: 10px;
  }

  .auth-header p {
    color: #666;
    font-size: 14px;
    margin: 0;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    display: block;
    font-weight: 600;
    color: #0f1419;
    margin-bottom: 8px;
    font-size: 14px;
  }

  .form-control {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.3s ease;
    background-color: #f8f9fa;
  }

  .form-control:focus {
    outline: none;
    border-color: #0db04b;
    background-color: white;
    box-shadow: 0 0 0 3px rgba(13, 176, 75, 0.1);
  }

  .form-check {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-check-input {
    width: 18px;
    height: 18px;
    border: 2px solid #e0e0e0;
    border-radius: 4px;
    cursor: pointer;
    accent-color: #0db04b;
  }

  .form-check-label {
    font-size: 14px;
    color: #666;
    cursor: pointer;
    margin: 0;
  }

  .forgot-password {
    text-align: right;
    margin-top: 10px;
  }

  .forgot-password a {
    color: #0db04b;
    font-size: 14px;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
  }

  .forgot-password a:hover {
    color: #0a9a3f;
  }

  .auth-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .btn-login {
    width: 100%;
    padding: 14px 20px;
    background: linear-gradient(135deg, #0db04b 0%, #0a9a3f 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(13, 176, 75, 0.3);
  }

  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(13, 176, 75, 0.4);
  }

  .btn-login:active {
    transform: translateY(0);
  }

  .auth-footer {
    text-align: center;
    margin-top: 25px;
    padding-top: 25px;
    border-top: 1px solid #e0e0e0;
  }

  .auth-footer p {
    font-size: 14px;
    color: #666;
    margin: 0;
  }

  .auth-footer a {
    color: #0db04b;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .auth-footer a:hover {
    color: #0a9a3f;
  }

  @media (max-width: 576px) {
    .auth-card {
      padding: 30px 20px;
    }

    .auth-header h2 {
      font-size: 24px;
    }
  }
</style>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2><i class="bi bi-box-arrow-in-right me-2"></i>Login</h2>
      <p>Welcome back to Hamro Agro Farm</p>
    </div>

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="username" class="form-label"><i class="bi bi-person-fill me-2"></i>Username</label>
        <input
          type="text"
          class="form-control"
          name="username"
          id="username"
          placeholder="Enter your username"
          required
        />
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label"><i class="bi bi-lock-fill me-2"></i>Password</label>
        <input
          type="password"
          class="form-control"
          name="password"
          id="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <div class="auth-options">
        <div class="form-check">
          <input type="checkbox" name="remember_me" class="form-check-input" id="remember_me">
          <label class="form-check-label" for="remember_me">Remember me</label>
        </div>
        <div class="forgot-password">
          <a href="{% url 'password_reset' %}">Forgot password?</a>
        </div>
      </div>
      
      <button type="submit" class="btn-login"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="{% url 'register' %}">Register now</a></p>
    </div>
  </div>
</div>

{% endblock %}
