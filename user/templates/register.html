{% extends 'base.html' %} 
{% block content %}

<style>
  .auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 20px;
  }

  .auth-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    padding: 40px;
    width: 100%;
    max-width: 500px;
  }

  .auth-header {
    text-align: center;
    margin-bottom: 35px;
  }

  .auth-header h2 {
    font-size: 28px;
    font-weight: 700;
    color: #0f1419;
    margin-bottom: 10px;
  }

  .auth-header p {
    color: #666;
    font-size: 14px;
    margin: 0;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    display: block;
    font-weight: 600;
    color: #0f1419;
    margin-bottom: 8px;
    font-size: 14px;
  }

  .form-control {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.3s ease;
    background-color: #f8f9fa;
  }

  .form-control:focus {
    outline: none;
    border-color: #0db04b;
    background-color: white;
    box-shadow: 0 0 0 3px rgba(13, 176, 75, 0.1);
  }

  .btn-register {
    width: 100%;
    padding: 14px 20px;
    background: linear-gradient(135deg, #0db04b 0%, #0a9a3f 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(13, 176, 75, 0.3);
  }

  .btn-register:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(13, 176, 75, 0.4);
  }

  .btn-register:active {
    transform: translateY(0);
  }

  .auth-footer {
    text-align: center;
    margin-top: 25px;
    padding-top: 25px;
    border-top: 1px solid #e0e0e0;
  }

  .auth-footer p {
    font-size: 14px;
    color: #666;
    margin: 0;
  }

  .auth-footer a {
    color: #0db04b;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .auth-footer a:hover {
    color: #0a9a3f;
  }

  @media (max-width: 576px) {
    .auth-card {
      padding: 30px 20px;
    }

    .auth-header h2 {
      font-size: 24px;
    }
  }
</style>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2><i class="bi bi-person-plus-fill me-2"></i>Create Account</h2>
      <p>Join Hamro Agro Farm today</p>
    </div>

    <form method="POST" action="{% url 'register' %}">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="username" class="form-label"><i class="bi bi-person-fill me-2"></i>Username</label>
        <input
          type="text"
          class="form-control"
          name="username"
          id="username"
          placeholder="Choose a username"
          required
        />
      </div>
      
      <div class="form-group">
        <label for="first_name" class="form-label"><i class="bi bi-person-fill me-2"></i>First Name</label>
        <input
          type="text"
          class="form-control"
          name="first_name"
          id="first_name"
          placeholder="Your first name"
          required
        />
      </div>
      
      <div class="form-group">
        <label for="last_name" class="form-label"><i class="bi bi-person-fill me-2"></i>Last Name</label>
        <input
          type="text"
          class="form-control"
          name="last_name"
          id="last_name"
          placeholder="Your last name"
          required
        />
      </div>
      
      <div class="form-group">
        <label for="email" class="form-label"><i class="bi bi-envelope-fill me-2"></i>Email Address</label>
        <input
          type="email"
          class="form-control"
          name="email"
          id="email"
          placeholder="your@email.com"
          required
        />
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label"><i class="bi bi-lock-fill me-2"></i>Password</label>
        <input
          type="password"
          class="form-control"
          name="password"
          id="password"
          placeholder="Create a strong password"
          required
        />
      </div>
      
      <div class="form-group">
        <label for="confirm_password" class="form-label"><i class="bi bi-lock-fill me-2"></i>Confirm Password</label>
        <input
          type="password"
          class="form-control"
          name="confirm_password"
          id="confirm_password"
          placeholder="Confirm your password"
          required
        />
      </div>
      
      <button type="submit" class="btn-register"><i class="bi bi-person-plus-fill me-2"></i>Register</button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
  </div>
</div>

{% endblock %}
