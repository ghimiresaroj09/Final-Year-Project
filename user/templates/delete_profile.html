{% extends 'base.html' %}

{% block content %}

<style>
  .confirmation-container {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 20px;
  }

  .confirmation-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    padding: 40px;
    width: 100%;
    max-width: 450px;
    text-align: center;
    border-top: 4px solid #dc3545;
  }

  .confirmation-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 25px;
    font-size: 40px;
    color: white;
  }

  .confirmation-card h2 {
    font-size: 26px;
    font-weight: 700;
    color: #0f1419;
    margin-bottom: 10px;
  }

  .confirmation-card p {
    color: #666;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 30px;
  }

  .confirmation-actions {
    display: flex;
    gap: 12px;
    flex-direction: column;
  }

  .btn-danger-gradient {
    padding: 14px 20px;
    background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
    text-decoration: none;
  }

  .btn-danger-gradient:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4);
  }

  .btn-secondary-gray {
    padding: 14px 20px;
    background: #f0f0f0;
    color: #0f1419;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-secondary-gray:hover {
    background: #e0e0e0;
    transform: translateY(-2px);
  }

  @media (max-width: 576px) {
    .confirmation-card {
      padding: 30px 20px;
    }

    .confirmation-card h2 {
      font-size: 22px;
    }
  }
</style>

<div class="confirmation-container">
  <div class="confirmation-card">
    <div class="confirmation-icon">
      <i class="bi bi-exclamation-triangle"></i>
    </div>
    
    <h2>Delete Account</h2>
    
    <p>
      <strong>Warning:</strong> This action is permanent and cannot be undone. 
      All your profile data, orders, and information will be deleted immediately.
    </p>
    
    <form method="POST" action="{% url 'delete_profile' %}">
      {% csrf_token %}
      <div class="confirmation-actions">
        <button type="submit" class="btn-danger-gradient">
          <i class="bi bi-trash-fill me-2"></i>Yes, Delete My Account
        </button>
        <a href="{% url 'view_profile' %}" class="btn-secondary-gray">
          <i class="bi bi-arrow-left me-2"></i>No, Go Back
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
