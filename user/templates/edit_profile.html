{% extends 'base.html' %}

{% block content %}

<style>
  .form-container {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 20px;
  }

  .form-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    padding: 40px;
    width: 100%;
    max-width: 550px;
  }

  .form-header {
    text-align: center;
    margin-bottom: 35px;
    padding-bottom: 25px;
    border-bottom: 2px solid #e0e0e0;
  }

  .form-header h2 {
    font-size: 28px;
    font-weight: 700;
    color: #0f1419;
    margin-bottom: 10px;
  }

  .form-header p {
    color: #666;
    font-size: 14px;
    margin: 0;
  }

  .form-group {
    margin-bottom: 25px;
  }

  .form-label {
    display: block;
    font-weight: 600;
    color: #0f1419;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .form-control {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.3s ease;
    background-color: #f8f9fa;
  }

  .form-control:disabled {
    background-color: #f0f0f0;
    color: #999;
  }

  .form-control:focus {
    outline: none;
    border-color: #0db04b;
    background-color: white;
    box-shadow: 0 0 0 3px rgba(13, 176, 75, 0.1);
  }

  .form-actions {
    display: flex;
    gap: 12px;
    margin-top: 35px;
  }

  .btn-submit {
    flex: 1;
    padding: 14px 20px;
    background: linear-gradient(135deg, #0db04b 0%, #0a9a3f 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(13, 176, 75, 0.3);
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(13, 176, 75, 0.4);
  }

  .btn-back {
    flex: 1;
    padding: 14px 20px;
    background: #f0f0f0;
    color: #0f1419;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-back:hover {
    background: #e0e0e0;
    transform: translateY(-2px);
  }

  @media (max-width: 576px) {
    .form-card {
      padding: 30px 20px;
    }

    .form-header h2 {
      font-size: 24px;
    }

    .form-actions {
      flex-direction: column;
    }
  }
</style>

<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <h2><i class="bi bi-pencil-square me-2"></i>Edit Profile</h2>
      <p>Update your profile information</p>
    </div>

    <form method="POST" action="{% url 'edit_profile' %}">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="username" class="form-label"><i class="bi bi-person-fill me-2"></i>Username</label>
        <input type="text" class="form-control" id="username" name="username" disabled value="{{ user.username }}"/>
      </div>
      
      <div class="form-group">
        <label for="first_name" class="form-label"><i class="bi bi-person-fill me-2"></i>First Name</label>
        <input type="text" class="form-control" id="first_name" name="first_name" required value="{{ user.first_name }}"/>
      </div>
      
      <div class="form-group">
        <label for="last_name" class="form-label"><i class="bi bi-person-fill me-2"></i>Last Name</label>
        <input type="text" class="form-control" id="last_name" name="last_name" required value="{{ user.last_name }}"/>
      </div>
      
      <div class="form-group">
        <label for="email" class="form-label"><i class="bi bi-envelope-fill me-2"></i>Email</label>
        <input type="text" class="form-control" id="email" name="email" required value="{{ user.email }}"/>
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn-submit"><i class="bi bi-check-circle me-2"></i>Update</button>
        <a href="{% url 'view_profile' %}" class="btn-back"><i class="bi bi-arrow-left me-2"></i>Back</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
