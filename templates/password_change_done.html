{% extends 'base.html' %}

{% block content %}

<style>
  .success-container {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 20px;
  }

  .success-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    padding: 40px;
    width: 100%;
    max-width: 450px;
    text-align: center;
    border-top: 4px solid #0db04b;
  }

  .success-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #0db04b 0%, #0a9a3f 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 25px;
    font-size: 40px;
    color: white;
    animation: scaleIn 0.5s ease;
  }

  @keyframes scaleIn {
    from {
      transform: scale(0);
      opacity: 0;
    }
    to {
      transform: scale(1);
      opacity: 1;
    }
  }

  .success-card h2 {
    font-size: 26px;
    font-weight: 700;
    color: #0f1419;
    margin-bottom: 10px;
  }

  .success-card p {
    color: #666;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 30px;
  }

  .btn-home {
    padding: 14px 32px;
    background: linear-gradient(135deg, #0db04b 0%, #0a9a3f 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(13, 176, 75, 0.3);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-home:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(13, 176, 75, 0.4);
  }

  @media (max-width: 576px) {
    .success-card {
      padding: 30px 20px;
    }

    .success-card h2 {
      font-size: 22px;
    }
  }
</style>

<div class="success-container">
  <div class="success-card">
    <div class="success-icon">
      <i class="bi bi-check-circle-fill"></i>
    </div>
    
    <h2>Password Changed Successfully</h2>
    
    <p>
      Your password has been updated successfully. 
      You can now log in with your new password.
    </p>
    
    <a href="{% url 'home' %}" class="btn-home">
      <i class="bi bi-house-fill"></i>Return to Home
    </a>
  </div>
</div>

<script>
    alertify.set('notifier','position', 'top-right');
    alertify.success('Your password has been changed successfully');
</script>

{% endblock %}
